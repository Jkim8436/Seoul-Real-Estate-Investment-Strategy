function num(n, d = 1) { return Number(n).toFixed(d); }

function ProfileSwitch({ profile, setProfile }) {
  return (
    <div style={{ display: "flex", gap: "6px" }}>
      {Object.keys(PROFILE_KEY).map((p) => (
        <button
          key={p}
          onClick={() => setProfile(p)}
          style={{
            padding: "7px 16px",
            borderRadius: "var(--border-radius-md)",
            border: p === profile ? `1.5px solid ${PROFILE_COLOR[p]}` : "0.5px solid var(--color-border-tertiary)",
            background: p === profile ? PROFILE_COLOR[p] : "transparent",
            color: p === profile ? "#ffffff" : "var(--color-text-secondary)",
            fontSize: "13px",
            fontWeight: p === profile ? 500 : 400,
            cursor: "pointer",
          }}
        >
          {p}
        </button>
      ))}
    </div>
  );
}

function KpiCard({ label, value, sub }) {
  return (
    <div style={{ background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-md)", padding: "0.85rem 1rem" }}>
      <p style={{ fontSize: "12px", color: "var(--color-text-secondary)", margin: "0 0 4px" }}>{label}</p>
      <p style={{ fontSize: "22px", fontWeight: 500, margin: 0 }}>{value}</p>
      {sub && <p style={{ fontSize: "11px", color: "var(--color-text-tertiary)", margin: "2px 0 0" }}>{sub}</p>}
    </div>
  );
}

function Top5Chart({ profile }) {
  const key = PROFILE_KEY[profile];
  const sorted = useMemo(() => [...DISTRICT_DATA].sort((a, b) => b[key] - a[key]).slice(0, 5), [key]);
  const max = sorted[0][key];
  return (
    <div>
      {sorted.map((d, i) => (
        <div key={d.district} style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: i === sorted.length - 1 ? 0 : "10px" }}>
          <span style={{ fontSize: "13px", width: "76px", flexShrink: 0, color: "var(--color-text-secondary)" }}>{d.name_en}</span>
          <div style={{ flex: 1, background: "var(--color-background-secondary)", borderRadius: "4px", height: "22px", position: "relative" }}>
            <div style={{ width: `${(d[key] / max) * 100}%`, background: PROFILE_COLOR[profile], height: "100%", borderRadius: "4px", minWidth: "2px" }} />
          </div>
          <span style={{ fontSize: "12px", width: "36px", textAlign: "right", color: "var(--color-text-secondary)" }}>{num(d[key], 2)}</span>
        </div>
      ))}
    </div>
  );
}

function ScatterChart({ profile }) {
  const key = PROFILE_KEY[profile];
  const top3Set = useMemo(() => new Set([...DISTRICT_DATA].sort((a, b) => b[key] - a[key]).slice(0, 3).map((d) => d.district)), [key]);
  const w = 640, h = 320, pad = { l: 46, r: 20, t: 20, b: 38 };
  const priceMin = 0.55, priceMax = 1.55, growthMin = 4, growthMax = 10.5;
  const x = (v) => pad.l + ((v - priceMin) / (priceMax - priceMin)) * (w - pad.l - pad.r);
  const y = (v) => h - pad.b - ((v - growthMin) / (growthMax - growthMin)) * (h - pad.t - pad.b);
  const avgPrice = DISTRICT_DATA.reduce((s, d) => s + d.price_ratio, 0) / DISTRICT_DATA.length;
  const avgGrowth = DISTRICT_DATA.reduce((s, d) => s + d.growth, 0) / DISTRICT_DATA.length;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: "320px" }}>
      <line x1={pad.l} y1={y(avgGrowth)} x2={w - pad.r} y2={y(avgGrowth)} stroke="var(--color-border-tertiary)" strokeDasharray="3 3" />
      <line x1={x(avgPrice)} y1={pad.t} x2={x(avgPrice)} y2={h - pad.b} stroke="var(--color-border-tertiary)" strokeDasharray="3 3" />
      <text x={pad.l} y={h - 12} fontSize="12" fill="var(--color-text-tertiary)">Cheaper</text>
      <text x={w - pad.r} y={h - 12} fontSize="12" fill="var(--color-text-tertiary)" textAnchor="end">Pricier</text>
      <text x={pad.l - 8} y={pad.t + 10} fontSize="12" fill="var(--color-text-tertiary)" textAnchor="end">High growth</text>
      {DISTRICT_DATA.map((d) => {
        const isTop = top3Set.has(d.district);
        return (
          <g key={d.district}>
            <circle
              cx={x(d.price_ratio)} cy={y(d.growth)}
              r={isTop ? 7 : 4.5}
              fill={isTop ? PROFILE_COLOR[profile] : "var(--color-border-secondary)"}
              opacity={isTop ? 1 : 0.55}
            />
            {isTop && (
              <text x={x(d.price_ratio) + 10} y={y(d.growth) + 4} fontSize="12" fill={PROFILE_COLOR_TEXT_ON_TINT[profile]} fontWeight="500">
                {d.name_en}
              </text>
            )}
          </g>
        );
      })}
    </svg>
  );
}

function TrendChart() {
  const w = 640, h = 260, pad = { l: 50, r: 50, t: 16, b: 34 };
  const years = MARKET_TREND.map((d) => d.year);
  const priceMin = 2000, priceMax = 4300;
  const volMin = 0, volMax = 190000;
  const x = (yr) => pad.l + ((yr - years[0]) / (years[years.length - 1] - years[0])) * (w - pad.l - pad.r);
  const yPrice = (v) => h - pad.b - ((v - priceMin) / (priceMax - priceMin)) * (h - pad.t - pad.b);
  const yVol = (v) => h - pad.b - ((v - volMin) / (volMax - volMin)) * (h - pad.t - pad.b);
  const barW = 30;
  const linePoints = MARKET_TREND.map((d) => `${x(d.year)},${yPrice(d.price_py)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: "260px" }}>
      {MARKET_TREND.map((d) => (
        <rect key={d.year} x={x(d.year) - barW / 2} y={yVol(d.volume)} width={barW} height={h - pad.b - yVol(d.volume)} fill="#FAC775" opacity="0.6" />
      ))}
      <polyline points={linePoints} fill="none" stroke="#378ADD" strokeWidth="2.5" />
      {MARKET_TREND.map((d) => (
        <circle key={d.year} cx={x(d.year)} cy={yPrice(d.price_py)} r="4" fill="#378ADD" />
      ))}
      {years.map((yr) => (
        <text key={yr} x={x(yr)} y={h - 10} fontSize="12" fill="var(--color-text-tertiary)" textAnchor="middle">{yr}</text>
      ))}
    </svg>
  );
}

function BuildingTypeChart({ profile }) {
  const data = BUILDING_TYPES[profile];
  const max = Math.max(...data.map((d) => Math.abs(d.score)));
  const min = Math.min(...data.map((d) => d.score), 0);
  const w = 640, h = data.length * 40 + 10, pad = { l: 150, r: 60 };
  const zeroX = pad.l + (Math.abs(min) / (max - min)) * (w - pad.l - pad.r);
  const scale = (w - pad.l - pad.r) / (max - min);
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: `${h}px` }}>
      <line x1={zeroX} y1={0} x2={zeroX} y2={h - 10} stroke="var(--color-border-secondary)" />
      {data.map((d, i) => {
        const barX = d.score < 0 ? zeroX - Math.abs(d.score) * scale : zeroX;
        const barW = Math.abs(d.score) * scale;
        const y = i * 40 + 6;
        return (
          <g key={d.district + d.type}>
            <text x={pad.l - 10} y={y + 14} fontSize="12" fill="var(--color-text-secondary)" textAnchor="end">{d.district} — {d.type}</text>
            <rect x={barX} y={y} width={Math.max(barW, 1)} height="20" fill={d.score >= 0 ? PROFILE_COLOR[profile] : "#D4537E"} rx="2" />
            <text x={d.score < 0 ? barX - 6 : barX + barW + 6} y={y + 15} fontSize="12" fill="var(--color-text-secondary)" textAnchor={d.score < 0 ? "end" : "start"}>
              {num(d.score, 2)}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function DongChart({ profile }) {
  const data = DONG_DATA[profile];
  const max = Math.max(...data.map((d) => d.score));
  return (
    <div>
      {data.map((d, i) => (
        <div key={d.district + d.dong} style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: i === data.length - 1 ? 0 : "9px" }}>
          <span style={{ fontSize: "12px", width: "120px", flexShrink: 0, color: "var(--color-text-secondary)" }}>{d.district} · {d.dong}</span>
          <div style={{ flex: 1, background: "var(--color-background-secondary)", borderRadius: "4px", height: "20px", position: "relative" }}>
            <div style={{ width: `${Math.max((d.score / max) * 100, 2)}%`, background: d.low_conf ? "var(--color-border-secondary)" : PROFILE_COLOR[profile], height: "100%", borderRadius: "4px" }} />
          </div>
          <span style={{ fontSize: "12px", width: "42px", textAlign: "right", color: "var(--color-text-secondary)" }}>{num(d.score, 2)}</span>
          {d.low_conf && (
            <span style={{ fontSize: "10px", padding: "1px 6px", borderRadius: "4px", background: "var(--color-background-secondary)", color: "var(--color-text-tertiary)", whiteSpace: "nowrap" }}>
              n={d.n}
            </span>
          )}
        </div>
      ))}
      {data.some((d) => d.low_conf) && (
        <p style={{ fontSize: "11px", color: "var(--color-text-tertiary)", margin: "10px 0 0" }}>
          Gray bar = fewer than 100 transactions — treat as low-confidence, not signal.
        </p>
      )}
    </div>
  );
}

function HoldoutChart() {
  const w = 640, h = 260, pad = { l: 20, r: 20, t: 20, b: 36 };
  const max = 11;
  const barGap = 44;
  const barW = 96;
  const startX = pad.l + 44;
  const yFor = (v) => h - pad.b - (v / max) * (h - pad.t - pad.b);
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: "260px" }}>
      <line x1={pad.l} y1={yFor(9.53)} x2={w - pad.r} y2={yFor(9.53)} stroke="#E24B4A" strokeDasharray="4 3" strokeWidth="1.5" />
      <text x={w - pad.r} y={yFor(9.53) - 8} fontSize="12" fill="#A32D2D" textAnchor="end">Seoul avg 9.53%</text>
      {HOLDOUT.map((d, i) => {
        const cx = startX + i * (barW + barGap);
        return (
          <g key={d.profile}>
            <rect x={cx} y={yFor(d.actual)} width={barW} height={h - pad.b - yFor(d.actual)} fill={PROFILE_COLOR[d.profile]} rx="3" />
            <text x={cx + barW / 2} y={yFor(d.actual) - 8} fontSize="13" fontWeight="500" fill="var(--color-text-primary)" textAnchor="middle">{d.actual}%</text>
            <text x={cx + barW / 2} y={h - 14} fontSize="12" fill="var(--color-text-secondary)" textAnchor="middle">{d.profile}</text>
          </g>
        );
      })}
    </svg>
  );
}

function RegressionChart() {
  const w = 640, h = 300, pad = { l: 100, r: 70, t: 10, b: 10 };
  const min = -60, max = 5;
  const zeroX = pad.l + ((0 - min) / (max - min)) * (w - pad.l - pad.r);
  const x = (v) => pad.l + ((v - min) / (max - min)) * (w - pad.l - pad.r);
  const rowH = 35;
  return (
    <svg viewBox={`0 0 ${w} ${REGRESSION_EFFECTS.length * rowH + 10}`} style={{ width: "100%", height: `${REGRESSION_EFFECTS.length * rowH + 10}px` }}>
      <line x1={zeroX} y1={0} x2={zeroX} y2={REGRESSION_EFFECTS.length * rowH} stroke="var(--color-border-secondary)" strokeWidth="1" />
      {REGRESSION_EFFECTS.map((d, i) => {
        const barX = d.pct < 0 ? x(d.pct) : zeroX;
        const barW = Math.abs(x(d.pct) - zeroX);
        const y = i * rowH + 7;
        const labelInside = barW > 90;
        return (
          <g key={d.district}>
            <text x={pad.l - 10} y={y + 15} fontSize="12" fill="var(--color-text-secondary)" textAnchor="end">{d.district}</text>
            <rect x={barX} y={y} width={Math.max(barW, 1)} height="20" fill="#D4537E" rx="2" />
            <text
              x={labelInside ? barX + 8 : barX - 8}
              y={y + 15}
              fontSize="12"
              fontWeight="500"
              fill={labelInside ? "#FBEAF0" : "var(--color-text-secondary)"}
              textAnchor={labelInside ? "start" : "end"}
            >
              {d.pct}%
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function ContributionChart({ profile }) {
  const key = PROFILE_KEY[profile];
  const top = useMemo(() => [...DISTRICT_DATA].sort((a, b) => b[key] - a[key])[0], [key]);
  const growth_c = top.growth > 8 ? 1.0 : 0.3;
  const price_c = (1 - top.price_ratio) * 1.5;
  const vol_c = (8 - top.vol) / 8;
  const total = top[key];
  const w = 640, h = 190, pad = { l: 150, r: 70 };
  const min = -1, max = 3.2;
  const x = (v) => pad.l + ((v - min) / (max - min)) * (w - pad.l - pad.r);
  const zeroX = x(0);
  const rows = [
    { label: "Growth", value: growth_c, color: "#5DCAA5" },
    { label: "Undervaluation", value: price_c, color: "#7F77DD" },
    { label: "Stability", value: vol_c, color: "#F0997B" },
  ];
  return (
    <div>
      <p style={{ fontSize: "13px", color: "var(--color-text-secondary)", margin: "0 0 12px" }}>
        Why <strong style={{ fontWeight: 500 }}>{top.name_en}</strong> scores highest under {profile}
      </p>
      <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: "190px" }}>
        <line x1={zeroX} y1={0} x2={zeroX} y2={h - 34} stroke="var(--color-border-secondary)" />
        {rows.map((r, i) => {
          const y = i * 42 + 6;
          const barX = r.value < 0 ? x(r.value) : zeroX;
          const barW = Math.abs(x(r.value) - zeroX);
          return (
            <g key={r.label}>
              <text x={pad.l - 10} y={y + 15} fontSize="12" fill="var(--color-text-secondary)" textAnchor="end">{r.label}</text>
              <rect x={barX} y={y} width={Math.max(barW, 1)} height="20" fill={r.color} rx="2" />
              <text x={x(r.value) + (r.value < 0 ? -8 : 8)} y={y + 15} fontSize="12" fill="var(--color-text-secondary)" textAnchor={r.value < 0 ? "end" : "start"}>
                {r.value > 0 ? "+" : ""}{num(r.value, 2)}
              </text>
            </g>
          );
        })}
        <text x={pad.l - 10} y={h - 12} fontSize="13" fontWeight="500" fill="var(--color-text-primary)" textAnchor="end">Composite score</text>
        <text x={zeroX + 8} y={h - 12} fontSize="13" fontWeight="500" fill="var(--color-text-primary)">{num(total, 2)}</text>
      </svg>
    </div>
  );
}

function Card({ title, sub, children }) {
  return (
    <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.1rem 1.25rem" }}>
      <p style={{ fontSize: "14px", fontWeight: 500, margin: "0 0 2px" }}>{title}</p>
      {sub && <p style={{ fontSize: "12px", color: "var(--color-text-tertiary)", margin: "0 0 14px" }}>{sub}</p>}
      {!sub && <div style={{ marginBottom: "14px" }} />}
      {children}
    </div>
  );
}

function Page1({ profile }) {
  const key = PROFILE_KEY[profile];
  const top1 = useMemo(() => [...DISTRICT_DATA].sort((a, b) => b[key] - a[key])[0], [key]);
  const recs = RECOMMENDATIONS[profile];
  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: "10px", marginBottom: "16px" }}>
        <KpiCard label="Analysis period" value="2018–2024" />
        <KpiCard label="Transactions analyzed" value="746,088" sub="post-IQR cleaning" />
        <KpiCard label="Seoul cumulative growth" value="56.2%" sub="price/pyeong, 2018→2024" />
        <KpiCard label={profile + " top pick"} value={top1.name_en} />
      </div>

      <div style={{ marginBottom: "12px" }}>
        <Card title="Top 5 districts" sub={profile + " profile, composite score"}>
          <Top5Chart profile={profile} />
        </Card>
      </div>

      <div style={{ marginBottom: "12px" }}>
        <Card title="Price vs. growth" sub="Filled dots = current profile's top 3">
          <ScatterChart profile={profile} />
        </Card>
      </div>

      <div style={{ marginBottom: "12px" }}>
        <Card title="Seoul market trend" sub="Line: price/pyeong (10k KRW) · bars: transaction volume">
          <TrendChart />
        </Card>
      </div>

      <Card title="Recommended shortlist" sub={profile + " — district × building type × dong"}>
        <table style={{ width: "100%", fontSize: "13px", borderCollapse: "collapse" }}>
          <thead>
            <tr style={{ borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
              <th style={{ textAlign: "left", padding: "8px 6px", color: "var(--color-text-secondary)", fontWeight: 400 }}>Rank</th>
              <th style={{ textAlign: "left", padding: "8px 6px", color: "var(--color-text-secondary)", fontWeight: 400 }}>District</th>
              <th style={{ textAlign: "left", padding: "8px 6px", color: "var(--color-text-secondary)", fontWeight: 400 }}>Building type</th>
              <th style={{ textAlign: "left", padding: "8px 6px", color: "var(--color-text-secondary)", fontWeight: 400 }}>Best dong</th>
            </tr>
          </thead>
          <tbody>
            {recs.map((r) => (
              <tr key={r.rank} style={{ borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
                <td style={{ padding: "8px 6px" }}>{r.rank}</td>
                <td style={{ padding: "8px 6px" }}>{r.district}</td>
                <td style={{ padding: "8px 6px" }}>{r.type}</td>
                <td style={{ padding: "8px 6px" }}>{r.dong}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </Card>

      <p style={{ fontSize: "13px", color: "var(--color-text-secondary)", marginTop: "14px", lineHeight: 1.65 }}>
        <strong style={{ fontWeight: 500 }}>{profile} profile:</strong> {top1.name_en} combines {profile === "Conservative" ? "a below-average price and low volatility" : profile === "Aggressive" ? "high historical growth and a meaningful price discount" : "above-average growth with below-average volatility"}, giving it the highest composite score under this weighting.
      </p>
    </div>
  );
}

function Page2({ profile }) {
  return (
    <div>
      <div style={{ marginBottom: "12px" }}>
        <Card title="Score contribution" sub="Decomposing the top pick's composite score">
          <ContributionChart profile={profile} />
        </Card>
      </div>

      <div style={{ marginBottom: "12px" }}>
        <Card title="Holdout validation" sub="TOP3 (from 2018–21 data) vs. actual 2022–24 growth">
          <HoldoutChart />
        </Card>
      </div>

      <div style={{ marginBottom: "12px" }}>
        <Card title="Building type score" sub={"Within " + profile + "'s TOP3 districts"}>
          <BuildingTypeChart profile={profile} />
        </Card>
      </div>

      <div style={{ marginBottom: "12px" }}>
        <Card title="Dong-level TOP5" sub="Within TOP3 districts, confidence-flagged">
          <DongChart profile={profile} />
        </Card>
      </div>

      <div style={{ marginBottom: "12px" }}>
        <Card title="Regression-adjusted district effect" sub="Price premium/discount net of building type, floor, age, year — 4 highest & 4 lowest shown">
          <RegressionChart />
        </Card>
      </div>

      <div style={{ background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-lg)", padding: "1.1rem 1.25rem" }}>
        <p style={{ fontSize: "14px", fontWeight: 500, margin: "0 0 8px" }}>Model limitations</p>
        <p style={{ fontSize: "13px", color: "var(--color-text-secondary)", margin: 0, lineHeight: 1.65 }}>
          This dashboard is a screening tool for narrowing candidate districts from historical transaction
          patterns. It excludes interest rates, jeonse-to-price ratios, redevelopment plans, and population
          flow, and the holdout test above shows all three profiles underperformed the Seoul average in
          2022–2024 — gains concentrated in already-premium districts during that period. It should not be
          used as a standalone investment decision tool.
        </p>
      </div>
    </div>
  );
}

function App() {
  const [profile, setProfile] = useState("Conservative");
  const [page, setPage] = useState(1);

  return (
    <div style={{ maxWidth: "720px" }}>
      <div style={{ marginBottom: "16px" }}>
        <h1 style={{ margin: "0 0 6px" }}>Seoul real estate investment screening</h1>
        <p style={{ fontSize: "13px", color: "var(--color-text-secondary)", margin: 0 }}>
          2018–2024 transaction data · district, building type, and dong-level screening by investor profile
        </p>
      </div>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "18px", flexWrap: "wrap", gap: "10px" }}>
        <ProfileSwitch profile={profile} setProfile={setProfile} />
        <div style={{ display: "flex", gap: "4px", background: "var(--color-background-secondary)", padding: "3px", borderRadius: "var(--border-radius-md)" }}>
          <button
            onClick={() => setPage(1)}
            style={{ padding: "6px 14px", borderRadius: "6px", border: "none", background: page === 1 ? "var(--color-background-primary)" : "transparent", color: "var(--color-text-primary)", fontSize: "13px", fontWeight: page === 1 ? 500 : 400, cursor: "pointer", boxShadow: page === 1 ? "0 0 0 0.5px var(--color-border-tertiary)" : "none" }}
          >
            Overview
          </button>
          <button
            onClick={() => setPage(2)}
            style={{ padding: "6px 14px", borderRadius: "6px", border: "none", background: page === 2 ? "var(--color-background-primary)" : "transparent", color: "var(--color-text-primary)", fontSize: "13px", fontWeight: page === 2 ? 500 : 400, cursor: "pointer", boxShadow: page === 2 ? "0 0 0 0.5px var(--color-border-tertiary)" : "none" }}
          >
            Validation
          </button>
        </div>
      </div>

      {page === 1 ? <Page1 profile={profile} /> : <Page2 profile={profile} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
</html>
